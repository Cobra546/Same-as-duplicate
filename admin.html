<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#152127"><title>Admin dashboard</title>
<style>
:root{color-scheme:dark;--bg:#152127;--panel:#1b292f;--line:#3b4a51;--text:#f3f5f7;--muted:#aab5bb;--blue:#0866df}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:15px Roboto,"Segoe UI",Arial,sans-serif}
main{width:min(100% - 32px,900px);margin:0 auto;padding:28px 0 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
h1{font-size:22px;margin:0;font-weight:800}.sub{color:var(--muted);font-size:13px;margin-top:6px}
button{border:1px solid var(--line);border-radius:999px;padding:10px 16px;background:transparent;color:var(--text);font-weight:700;cursor:pointer}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.count{font-size:30px;font-weight:800;margin:4px 0}.muted{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;margin-top:16px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}th{color:var(--muted);font-weight:700}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}.error{color:#ff9b9b;padding:20px 0}
@media(max-width:560px){main{width:min(100% - 24px,900px)}.panel{padding:12px}th,td{padding:11px 6px;font-size:12px}.sub{max-width:220px}h1{font-size:19px}}
</style></head>
<body><main>
<header><div><h1>Admin dashboard</h1><div class="sub">Registered app accounts</div></div><button id="logout">Log out</button></header>
<section class="panel"><div class="muted">Total registered profiles</div><div class="count" id="count">—</div><div class="muted">Passwords are never displayed or stored in this dashboard.</div>
<div id="result"><div class="empty">Loading accounts...</div></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
<script>
const SUPABASE_URL='https://antqqabimhgepykkkmwl.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_w6n4kCXq8cJoyd-8PE0HoQ_YBPYoI_7';
const ADMIN_EMAIL='usmantabish26@gmail.com';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const result=document.getElementById('result');
function safe(value){return String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function init(){
 const {data:{user},error:authError}=await supabase.auth.getUser();
 if(authError||!user){window.location.href='index.html';return;}
 if((user.email||'').toLowerCase()!==ADMIN_EMAIL){result.innerHTML='<div class="error">Access denied.</div>';return;}
 const {data,error}=await supabase.from('profiles').select('email,display_name,created_at').order('created_at',{ascending:false});
 if(error){result.innerHTML='<div class="error">Could not load accounts. Check the Supabase table policies.</div>';return;}
 document.getElementById('count').textContent=data.length;
 if(!data.length){result.innerHTML='<div class="empty">No registered profiles yet.</div>';return;}
 const rows=data.map(p=>'<tr><td>'+safe(p.display_name||'—')+'</td><td>'+safe(p.email||'—')+'</td><td>'+safe(new Date(p.created_at).toLocaleString())+'</td></tr>').join('');
 result.innerHTML='<div style="overflow-x:auto"><table><thead><tr><th>Display name</th><th>Email</th><th>Registered</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
document.getElementById('logout').addEventListener('click',async()=>{await supabase.auth.signOut();window.location.href='index.html';});
init();
</script></body></html>
