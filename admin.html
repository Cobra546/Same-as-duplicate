<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#152127"><title>Friend Survey Demo — Admin</title>
<style>
:root{color-scheme:dark;--bg:#152127;--panel:#1b292f;--line:#3b4a51;--text:#f3f5f7;--muted:#aab5bb;--blue:#0866df}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:15px Roboto,"Segoe UI",Arial,sans-serif}
main{width:min(100% - 32px,900px);margin:0 auto;padding:28px 0 48px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
h1{font-size:22px;margin:0;font-weight:800}.sub{color:var(--muted);font-size:13px;margin-top:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.count{font-size:30px;font-weight:800;margin:4px 0}.muted{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;margin-top:16px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}th{color:var(--muted);font-weight:700}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}.error{color:#ff9b9b;padding:14px 0}
input{display:block;width:100%;height:48px;margin:12px 0;padding:0 13px;border:1px solid var(--line);border-radius:8px;background:#182126;color:var(--text);font:inherit;letter-spacing:5px}
button{border:0;border-radius:999px;padding:12px 18px;background:var(--blue);color:white;font-weight:700;cursor:pointer}
@media(max-width:560px){main{width:min(100% - 24px,900px)}.panel{padding:12px}th,td{padding:11px 6px;font-size:12px}h1{font-size:19px}}
</style></head><body><main>
<header><div><h1>Friend Survey Demo</h1><div class="sub">Prank demo submissions</div></div><button id="logout" hidden>Lock</button></header>
<section class="panel" id="pinPanel"><h2 style="font-size:17px;margin:0">Enter admin PIN (demo)</h2><form id="pinForm"><input id="adminPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="PIN code" autocomplete="off" required><button type="submit">Unlock</button></form><div class="error" id="pinError"></div></section>
<section class="panel" id="dataPanel" hidden><div class="muted">Total submissions</div><div class="count" id="count">—</div><div id="result"><div class="empty">Loading submissions...</div></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script><script>
const supabase=window.supabase.createClient('https://gkavoeqamdieuqzfcgxk.supabase.co','sb_publishable_Xa8CoE_LnyHiFFGnX1F9Aw_gXwlI1GY');
const pinPanel=document.getElementById('pinPanel'),dataPanel=document.getElementById('dataPanel'),result=document.getElementById('result');
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function lock(){pinPanel.hidden=false;dataPanel.hidden=true;document.getElementById('logout').hidden=true;document.getElementById('adminPin').value='';}
async function unlock(pin){
 const {data,error}=await supabase.rpc('admin_get_profile_submissions',{pin});
 if(error){document.getElementById('pinError').textContent='Incorrect PIN or unable to load submissions.';return;}
 document.getElementById('pinError').textContent='';
 pinPanel.hidden=true;dataPanel.hidden=false;document.getElementById('logout').hidden=false;
 document.getElementById('count').textContent=data.length;
 if(!data.length){result.innerHTML='<div class="empty">No submissions yet.</div>';return;}
 const rows=data.map(p=>'<tr><td>'+safe(p.username)+'</td><td>'+safe(p.display_name)+'</td><td>'+safe(new Date(p.created_at).toLocaleString())+'</td></tr>').join('');
 result.innerHTML='<div style="overflow-x:auto"><table><thead><tr><th>First box</th><th>Display name</th><th>Submitted</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
document.getElementById('pinForm').addEventListener('submit',async e=>{e.preventDefault();await unlock(document.getElementById('adminPin').value);});
document.getElementById('logout').addEventListener('click',lock);
</script></body></html>
