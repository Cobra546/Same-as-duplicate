<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#152127">
  <title>Log in</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #152127;
      --field: #182126;
      --border: #465057;
      --muted: #aab0b5;
      --text: #f3f5f7;
      --blue: #0866df;
      --blue-light: #5ba4ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--background);
      color: var(--text);
      font-family: Roboto, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      width: min(100%, 720px);
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding: max(24px, env(safe-area-inset-top)) 28px max(26px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }
    .top-placeholder { height: 31vh; min-height: 190px; max-height: 360px; flex: 0 0 auto; position: relative; }
    .top-image-holder { width: 88px; height: 88px; position: absolute; top: 58%; left: 50%; transform: translate(-50%, -50%); background: transparent; }
    .login-form { display: flex; flex-direction: column; gap: 12px; }
    .field {
      width: 100%;
      height: 52px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--field);
      color: var(--text);
      padding: 0 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .field::placeholder { color: var(--muted); opacity: 1; }
    .field:focus { border-color: var(--blue-light); box-shadow: 0 0 0 3px #5ba4ff20; }
    .login-button {
      height: 50px;
      width: 100%;
      border: 0;
      border-radius: 999px;
      background: var(--blue);
      color: white;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: filter .15s ease, transform .15s ease;
    }
    .login-button:active, .create-button:active { transform: scale(.99); }
    .login-button:hover { filter: brightness(1.08); }
    .forgot {
      align-self: center;
      margin-top: 4px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      line-height: 1.4;
    }
    .forgot:hover { text-decoration: underline; }
    .bottom-area { margin-top: auto; padding-top: 32px; }
    .create-button {
      min-height: 48px;
      width: 100%;
      border: 2px solid #559cff;
      border-radius: 999px;
      background: transparent;
      color: var(--blue-light);
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s ease, transform .15s ease;
    }
    .create-button:hover { background: #559cff12; }
    /* Image slot sized to match the small Meta mark in the reference screenshot. */
    .bottom-image-holder {
      width: 120px;
      height: 32px;
      margin: 16px auto 0;
      background: transparent;
    }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--blue-light); outline-offset: 4px; }
    @media (max-height: 760px) {
      .top-placeholder { height: 27vh; min-height: 150px; }
      .field { height: 50px; border-radius: 8px; }
      .login-form { gap: 10px; }
      .login-button { height: 48px; }
      .bottom-area { padding-top: 28px; }
      .create-button { min-height: 46px; }
      .bottom-image-holder { height: 32px; margin-top: 16px; }
    }
    @media (max-width: 380px) {
      .page { padding-left: 20px; padding-right: 20px; }
      .field { padding: 0 21px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="top-placeholder"><div class="top-image-holder" aria-label="Reserved top logo image holder"></div></div>

    <form class="login-form" id="loginForm">
      <input class="field" id="identity" name="identity" type="text"
        placeholder="Username, email or mobile number" autocomplete="username"
        aria-label="Username, email or mobile number" required>
      <input class="field" id="displayName" name="displayName" type="text"
        placeholder="Display name" autocomplete="nickname"
        aria-label="Display name" required>
      <button class="login-button" type="submit">Log in</button>
      <a class="forgot" href="#" id="forgotLink">Forgot password?</a>
    </form>

    <div class="bottom-area">
      <button class="create-button" type="button" id="createAccount">Create new account</button>
      <div class="bottom-image-holder" aria-label="Reserved image holder"></div>
    </div>
  </main>
  <script>
    // Visual starter only: authentication and account routes can be connected next.
    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault();
    });
    document.getElementById('forgotLink').addEventListener('click', function (event) {
      event.preventDefault();
    });
    document.getElementById('createAccount').addEventListener('click', function () {
      // Sign-up screen/route will be added when its flow is specified.
    });
  </script>
</body>
</html>
